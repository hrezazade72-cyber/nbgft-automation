name: Daily Instagram Reel

on:
  schedule:
    # اجرای هر روز ساعت 18:00 به وقت تهران (UTC+3:30) -> 14:30 UTC
    - cron: "30 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0 ffmpeg
          pip install -r requirements.txt

      - name: Download Persian font
        run: curl -L -o Vazirmatn-Bold.ttf "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"

      - name: Run Instagram bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python instagram_main.py

      - name: Commit posted history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted_instagram.json
          git commit -m "update posted instagram quotes [skip ci]" || echo "no changes"
          git push
