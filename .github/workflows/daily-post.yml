name: Daily Telegram Post

on:
  schedule:
    # هر روز ساعت 09:00 به وقت تهران (UTC+3:30) -> 05:30 UTC
    - cron: "30 5 * * *"
    # هر روز ساعت 16:00 به وقت تهران -> 12:30 UTC
    - cron: "30 12 * * *"
    # هر روز ساعت 22:00 به وقت تهران -> 18:30 UTC
    - cron: "30 18 * * *"
  workflow_dispatch: {}   # اجازه‌ی اجرای دستی از تب Actions برای تست

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfribidi0
          pip install -r requirements.txt

      - name: Download Persian font
        run: curl -L -o Vazirmatn-Bold.ttf "https://github.com/rastikerdar/vazirmatn/raw/master/fonts/ttf/Vazirmatn-Bold.ttf"

      - name: Run bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          CHANNEL_HANDLE: ${{ secrets.CHANNEL_HANDLE }}
        run: python main.py

      - name: Commit posted history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posted.json
          git commit -m "update posted quotes [skip ci]" || echo "no changes"
          git push
